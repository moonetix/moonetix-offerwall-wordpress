name: wordpress.org listing

on:
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-org
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the listing logic
        run: node --test '.github/scripts/*.test.mjs'

      # Opens an issue the first time wordpress.org lists the plugin, keeps one open
      # while its version there differs from this repository, and one while it is closed.
      - name: Check the wordpress.org listing
        run: node .github/scripts/check-wordpress-org.mjs --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close the failure issue
        if: success()
        run: node .github/scripts/github-issue.mjs close --topic wporg-check-failed --comment "The wordpress.org check ran cleanly again."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report a failed run
        if: failure()
        run: |
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The weekly wordpress.org check failed, so a change to the plugin listing would go unnoticed. The plugins API may be down or its answer may have changed.

          Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This issue closes itself after the next clean run.
          EOF
          node .github/scripts/github-issue.mjs upsert --topic wporg-check-failed --title "wordpress.org check failed" --body-file "$RUNNER_TEMP/body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub disables scheduled workflows after 60 days without repository activity.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/wordpress-org.yml/enable"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
